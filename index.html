<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DentControl — controle financeiro para dentistas autônomas</title>
    <meta name="description" content="O DentControl organiza os recebíveis de dentistas autônomas que atendem em várias clínicas: calcula automaticamente as datas de pagamento, mostra o que já entrou, o que está pendente e o que atrasou." />

    <!-- Compartilhamento em redes sociais e WhatsApp (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DentControl" />
    <meta property="og:title" content="DentControl — controle financeiro para dentistas autônomas" />
    <meta property="og:description" content="Organize os recebíveis de várias clínicas num só lugar, com cálculo automático de datas de pagamento." />
    <!-- Troque pelo seu domínio de verdade assim que comprar -->
    <meta property="og:url" content="https://dentcontrol.com.br" />
    <meta property="og:image" content="https://dentcontrol.com.br/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Ajuda o Google a entender do que se trata o site (importante para resumos de IA na busca) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "DentControl",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "Sistema de controle financeiro para dentistas autônomas que atendem em várias clínicas. Calcula automaticamente datas de pagamento, organiza recebíveis por clínica e compara receita mês a mês.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      }
    }
    </script>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />

    <!-- iOS: faz o app abrir em tela cheia quando adicionado à Tela de Início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DentControl" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; overflow-x: hidden; }

      @media (max-width: 820px) {
        .app-shell { flex-direction: column !important; }
        .app-sidebar {
          width: 100% !important;
          flex-direction: row !important;
          flex-wrap: wrap !important;
          align-items: center !important;
          justify-content: space-between !important;
          padding: 10px 14px !important;
          gap: 10px !important;
          border-right: none !important;
        }
        .app-sidebar-brand { flex: 1 1 auto; }
        .app-sidebar-smile { display: none !important; }
        .app-sidebar-nav {
          flex-direction: row !important;
          gap: 4px !important;
          overflow-x: auto;
          flex: 1 1 100%;
        }
        .app-sidebar-nav button { flex-shrink: 0; padding: 8px 10px !important; }
        .app-sidebar-nav .nav-label { display: none; }
        .app-sidebar-bottom {
          margin-top: 0 !important;
          flex-direction: row !important;
          flex: 1 1 100%;
          justify-content: space-between !important;
        }
        .app-main { padding: 16px !important; }
      }
    </style>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
